[project]
name = "backend"
version = "0.1.0"
description = "Serviço local de orquestração do Totem BinGo no Orange Pi"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.141.1,<1",
    "httpx2>=2.13.1,<3",
    "pillow>=12,<13",
    "pydantic>=2.13.5,<3",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
