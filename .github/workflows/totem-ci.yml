name: Totem CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "Software/apps/totem_kiosk_wireframe/**"
      - ".github/workflows/totem-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "Software/apps/totem_kiosk_wireframe/**"
      - ".github/workflows/totem-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check Software/apps/totem_kiosk_wireframe/script.js
