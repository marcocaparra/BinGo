name: Totem CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "Software/apps/totem_ui/**"
      - "Hardware/TotemEdge/**"
      - ".github/workflows/totem-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "Software/apps/totem_ui/**"
      - "Hardware/TotemEdge/**"
      - ".github/workflows/totem-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: totem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check Software/apps/totem_ui/script.js

  edge-tests:
    name: TotemEdge synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install locked test dependencies and formatter
        working-directory: Hardware/TotemEdge/backend
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked
          uv format --version 0.15.22 --check -- app tests ../deploy

      # No secrets, hosted Supabase, Compose, physical drivers or economic writes.
      - name: Run deterministic integration profile
        run: python -B Hardware/TotemEdge/deploy/validate.py integration

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totem-edge-validation
          path: Hardware/TotemEdge/deploy/.validation/profiles-*/
          include-hidden-files: true
          retention-days: 7
