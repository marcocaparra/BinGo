name: Backend CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - "Software/backend/**"
      - "Software/database/**"
      - "Software/supabase/**"
      - "Software/package.json"
      - "Software/package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
    paths:
      - "Software/backend/**"
      - "Software/database/**"
      - "Software/supabase/**"
      - "Software/package.json"
      - "Software/package-lock.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINGO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BINGO_RPC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BINGO_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PGCONNECT_TIMEOUT: "10"
    defaults:
      run:
        working-directory: Software/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Software/backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install locked Supabase CLI
        working-directory: Software
        run: npm ci

      - name: Start local Supabase
        id: supabase
        working-directory: Software
        run: |
          docker info > /dev/null
          node node_modules/supabase/dist/supabase.js start > "$RUNNER_TEMP/supabase-start.log" 2>&1

      - name: Reset local database with migrations and seeds
        working-directory: Software
        run: node node_modules/supabase/dist/supabase.js db reset --local

      - name: Verify database readiness and Admin migrations
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['BINGO_TEST_DATABASE_URL']) as db:
              for name in ('get_admin_machines_v1', 'get_admin_deposits_v1'):
                  if db.execute('select to_regprocedure(%s)', (f'public.{name}()',)).fetchone()[0] is None:
                      raise SystemExit(f'Local database is missing required RPC: {name}')
          print('Local PostgreSQL is ready; Admin migrations 030/031 are present.')
          PY

      # Database suites share fixtures: keep pgTAP and pytest sequential.
      - name: Run pgTAP authorization and database tests
        working-directory: Software
        run: node node_modules/supabase/dist/supabase.js test db --local

      - name: Run tests
        run: python -m pytest -q -rs --junitxml=pytest-results.xml

      - name: Reject skipped or uncollected tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('pytest-results.xml').getroot()
          cases = list(root.iter('testcase'))
          skipped = [case.get('name') for case in cases if case.find('skipped') is not None]
          if not cases or skipped:
              raise SystemExit(f'Expected collected tests with no skips; collected={len(cases)}, skipped={skipped}')
          print(f'{len(cases)} tests collected, no skips.')
          PY

      - name: Diagnose local infrastructure failure
        if: failure()
        working-directory: Software
        run: |
          if [ -f "$RUNNER_TEMP/supabase-start.log" ]; then
            cat "$RUNNER_TEMP/supabase-start.log"
          fi
          docker ps -a
          docker logs --tail 100 supabase_db_Software

      - name: Stop local Supabase
        if: always() && steps.supabase.outcome != 'skipped'
        working-directory: Software
        run: node node_modules/supabase/dist/supabase.js stop --no-backup
