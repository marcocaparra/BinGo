<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinGo • Descartar Agora</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/pages/discard.css">
</head>

<body>
  <main class="discard-wrapper">
    
    <section class="discard-card" id="discard-section">
      <div class="left">
        <h1>Valide aqui<br>seu código!</h1>
        <p class="subtitle">Evolua seu “Ecossistema” e ganhe pontos.</p>

        <div class="form">
          <div class="field">
            <input type="text" id="discardCode" placeholder=" " />
            <label for="discardCode">Digite aqui...</label>
          </div>

          <button class="discard-btn" id="discardBtn">VALIDAR</button>
          <div id="feedback" class="error hidden"></div>
        </div>
      </div>

      <div class="right">
        <img 
          src="../assets/images/bingolino-discard.png" 
          alt="Bingolino animado com celular"
          id="bingolino-img">
      </div>
    </section>

    <section class="discard-result hidden" id="success-section">
      <div class="result-left">
        <img 
          src="../assets/images/bingolino-happy.png" 
          alt="Bingolino feliz comemorando"
          class="result-img">
      </div>

      <div class="result-right">
        <h1 class="success-title">CÓDIGO VÁLIDO!</h1>
        <div class="info-card">
          <span>🌱 Seu nível: <strong id="userLevel">1</strong></span>
        </div>
        <div class="info-card">
          <img src="../assets/images/bin-coin.png" alt="Ícone de pontos" class="coin-icon">
          <span>Pontos totais: <strong id="userPoints">0</strong></span>
        </div>
      </div>
    </section>

    <section class="discard-result hidden" id="error-section">
      <div class="result-left">
        <img 
          src="../assets/images/bingolino-error.png" 
          alt="Bingolino confuso"
          class="result-img">
      </div>

      <div class="result-right">
        <h1 class="error-title">OPS! CÓDIGO INVÁLIDO.</h1>
        <p class="subtitle">Tente novamente ou verifique se o código já foi utilizado.</p>
        <button id="tryAgainBtn">TENTAR NOVAMENTE</button>
      </div>
    </section>

    <footer class="bottom-nav">
      <div class="nav-box">
        <span class="brand">BinGo —</span>
        <button class="back-btn" id="backBtn">VOLTAR</button>
      </div>
    </footer>
  </main>

  <script type="module" src="../js/discardPage.js"></script>
</body>
</html>
