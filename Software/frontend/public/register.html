<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="api-base-url" content="http://localhost:8000"/>
  <title>Cadastrar • BinGo</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/pages/register.css"/>
  <link rel="stylesheet" href="../css/pages/loader.css"/>
</head>
<body>

  <div id="pageLoader" class="page-loader is-visible" aria-hidden="false">
    <div class="bl-wrap">
      <div class="bl-row">
        <img class="bl-bingo" src="/public/assets/images/bingolino_cafe.png" alt="">
        <div class="bl-right">
          <img class="bl-gif" src="/public/assets/images/loader-icon.gif" alt="">
          <p class="bl-text">Carregando...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="register-container">
    <div class="card" id="step1">
      <h1>Ótima iniciativa!</h1>
      <p>Você já deu o primeiro passo. Agora precisamos saber mais sobre você:</p>
      <form id="step1Form">
        <div class="field">
          <input id="fullName" type="text" placeholder=" " required>
          <label for="fullName">Digite o seu nome</label>
        </div>
        <div class="field">
          <input id="username" type="text" placeholder=" " required>
          <label for="username">Nome de usuário</label>
        </div>
        <button class="btn" type="submit">PRÓXIMO →</button>
      </form>
    </div>

    <div class="card hidden" id="step2">
      <h1 id="welcomeName">Prazer!</h1>
      <p>Agora vamos para os últimos detalhes:</p>
      <form id="step2Form">
        <div class="field">
          <input id="cpf" type="text" placeholder=" ">
          <label for="cpf">CPF</label>
        </div>
        <div class="field">
          <input id="phone" type="text" placeholder=" ">
          <label for="phone">Número de telefone</label>
        </div>
        <div class="field">
          <input id="email" type="email" placeholder=" " required>
          <label for="email">E-mail</label>
        </div>

        <div class="field password-field-container">
          <input id="password" type="password" placeholder=" " required minlength="6">
          <label for="password">Senha</label>
          <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Mostrar/Ocultar senha">
            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2BFDBE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C7F9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <button class="btn" type="submit">ENTRAR →</button>
        <div id="registerError" class="error hidden"></div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/ui/loader-nav.js"></script>
  <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
