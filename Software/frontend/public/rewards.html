<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recompensas • BinGo</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pages/rewards.css">
  <link rel="stylesheet" href="../css/pages/loader.css">
</head>
<body>

  <div id="pageLoader" class="page-loader is-visible" aria-hidden="false">
    <div class="loader-wrap">
      <div class="loader-row">
        <img class="loader-bingo" src="/public/assets/images/bingolino_cafe.png" alt="">
        <img class="loader-gif"   src="/public/assets/images/loader-icon.gif" alt="">
      </div>
      <p class="loader-text">Carregando...</p>
    </div>
  </div>

  <header class="top-header">
    <div class="avatar-box">
      <img src="/public/assets/images/bingolino-avatar.png" alt="Avatar" class="avatar">
    </div>
    <div class="user-meta">
      <span id="userName">Carregando...</span>
      <span class="divider">|</span>
      <img src="/public/assets/images/bin-coin.png" alt="BinCoins" class="coin-icon">
      <span id="userBins">0</span>
    </div>
  </header>

  <div class="content-wrapper">
    <div class="panel">
      <div class="rewards-grid" id="rewards-grid"></div>
    </div>
  </div>

  <footer class="bottom-nav">
    <div class="nav-box">
      <span class="brand">BinGo ㅤ—</span>
      <div class="tabs">
        <button onclick="goTo('dashboard.html')" class="tab">INÍCIO</button>
        <button onclick="goTo('missions.html')" class="tab">MISSÕES</button>
        <button onclick="goTo('ranking.html')" class="tab">RANKING</button>
        <button onclick="goTo('rewards.html')" class="tab active">RECOMPENSAS</button>
        <button onclick="goTo('profile.html')" class="tab">PERFIL</button>
      </div>
    </div>
  </footer>

  <div class="modal-overlay hidden" id="success-modal">
    <div class="modal-content">
      <div class="modal-body">
        <div class="modal-text">
          <h1>RETIRE COM O CÓDIGO ABAIXO:</h1>
          <div class="code-display" id="redemption-code">XXXXXX</div>
        </div>
        <img src="/public/assets/images/bingolino-happy.png" alt="Bingolino com presente" class="modal-mascot">
      </div>
      <div class="modal-footer">
        <button class="modal-btn" id="modal-close-btn"><strong>VOLTAR</strong></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="../js/ui/loader-nav.js"></script>
  <script type="module" src="../js/pages/rewardsPage.js"></script>
  <script>
    function goTo(page) { location.href = `./${page}`; }
  </script>
</body>
</html>
