<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="api-base-url" content="http://localhost:8000"/>
  <title>Dashboard • BinGo</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/pages/dashboard.css">
  <link rel="stylesheet" href="../css/pages/loader.css">
</head>
<body>

  <div id="pageLoader" class="page-loader is-visible" aria-hidden="false">
    <div class="bl-wrap">
      <div class="bl-row">
        <img class="bl-bingo" src="/public/assets/images/bingolino_cafe.png" alt="">
        <div class="bl-right">
          <img class="bl-gif" src="/public/assets/images/loader-icon.gif" alt="">
          <p class="bl-text">Carregando...</p>
        </div>
      </div>
    </div>
  </div>

  <header class="top-header">
    <div class="avatar-box">
      <img src="/public/assets/images/bingolino-avatar.png" alt="Avatar" class="avatar">
    </div>
    <div class="user-meta">
      <span id="userName">Carregando...</span>
      <span class="divider">|</span>
      <img src="/public/assets/images/bin-coin.png" alt="Bins" class="coin-icon">
      <span id="userBins">0</span>
    </div>
  </header>

  <div class="content">
    <aside class="left-cards">
      <div onclick="goTo('discard.html')" class="side-card">
        <img src="/public/assets/images/discard.png" alt="Lixo">
        <span>Descartar Lixo Eletrônico Agora</span>
      </div>
      <div onclick="goTo('missions.html')" class="side-card">
        <img src="/public/assets/images/mission.png" alt="Missão">
        <span>Aceite um Desafio e Suba no Ranking</span>
      </div>
      <div onclick="goTo('ranking.html')" class="side-card">
        <img src="/public/assets/images/star.png" alt="Estrela">
        <span>Cheque os resultados dos seus esforços</span>
      </div>
    </aside>

    <main class="center-stage">
      <img src="/public/assets/images/ecosystem_level_1.png" alt="Seu ecossistema" class="ecosystem">
      <h2 class="level-title">Seu nível: <span id="userLevel" class="level-name">Carregando...</span></h2>
      <p class="level-sub">A cada novo nível conquistado, seu "Ecossistema" evolui!</p>

      <div id="dashboardError" class="error hidden"></div>
    </main>
  </div>

  <footer class="bottom-nav">
    <div class="nav-box">
      <span class="brand">BinGo ㅤ—</span>
      <div class="tabs">
        <button onclick="goTo('dashboard.html')" class="tab active">INÍCIO</button>
        <button onclick="goTo('missions.html')" class="tab">MISSÕES</button>
        <button onclick="goTo('ranking.html')" class="tab">RANKING</button>
        <button onclick="goTo('rewards.html')" class="tab">RECOMPENSAS</button>
        <button onclick="goTo('profile.html')" class="tab">PERFIL</button>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/ui/loader-nav.js"></script>
  <script type="module" src="../js/pages/dashboard.js"></script>
  <script>
    function goTo(page) { location.href = `./${page}`; }
  </script>
</body>
</html>
