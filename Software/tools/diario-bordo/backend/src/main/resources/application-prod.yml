spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    team-pin: ${DIARY_TEAM_PIN}
    admin-pin: ${DIARY_ADMIN_PIN}
    signing-secret: ${DIARY_AUTH_SIGNING_SECRET}
  attachments:
    enabled: ${ATTACHMENTS_ENABLED:false}

logging:
  level:
    root: WARN
    com.bingo.diario: INFO
