server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: diario-bordo-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:3}
      minimum-idle: ${DATABASE_MIN_IDLE:0}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true

  jackson:
    time-zone: America/Sao_Paulo

  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 96MB

app:
  public-base-url: "${DIARY_PUBLIC_BASE_URL:http://127.0.0.1:8080}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173}"
  auth:
    team-pin: "${DIARY_TEAM_PIN:261026}"
    admin-pin: "${DIARY_ADMIN_PIN:626262}"
    signing-secret: "${DIARY_AUTH_SIGNING_SECRET:local-development-signing-secret-change-me}"
    token-ttl-hours: ${DIARY_TOKEN_TTL_HOURS:8}
  attachments:
    enabled: ${ATTACHMENTS_ENABLED:true}
    storage-path: "${DIARY_ATTACHMENTS_PATH:uploads/diario-bordo}"
