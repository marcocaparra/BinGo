services:
  backend-dev:
    image: python:3.12-slim
    container_name: bingo-backend-dev
    working_dir: /app/backend
    command: sh -c "pip install -e .[dev] && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # Supabase local DB from supabase/config.toml: host port 54322 -> container port 5432.
      # Inside Docker, host.docker.internal points back to the host where Supabase exposes 54322.
      BINGO_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      BINGO_JWT_SECRET: dev-secret
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
