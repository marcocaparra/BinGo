services:
  db:
    image: mysql:8.0
    container_name: software-db-1
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bingo_db
      MYSQL_USER: bingo_user
      MYSQL_PASSWORD: Bingolino53787
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      timeout: 20s
      retries: 10
    networks:
      - app_network

  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: software-backend-1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
                                   
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app             
      DATABASE_HOST: db            
      DATABASE_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-bingo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Bingolino53787}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bingo_db}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge