services:
  db:
    image: postgres:16
    container_name: bingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo123
      POSTGRES_DB: bingo_dev
    ports:
      - "5432:5432"
    volumes:
      - bingo_pgdata:/var/lib/postgresql/data

volumes:
  bingo_pgdata: